# GitHub Container Registry (GHCR) specific overrides for production environment

# Global settings
global:
  environment: production
  cluster: prod-cluster

# Storage configuration for all components
storage:
  storageClass: standard  # Use standard storage class for GHCR

# Service configuration for all components
service:
  type: ClusterIP  # Use ClusterIP for GHCR
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

# Node selector and tolerations for all components
nodeSelector:
  kubernetes.io/os: linux
tolerations: []

# Image pull secrets for GHCR
imagePullSecrets:
- name: ghcr-secret

# Container registry configuration for all components
image:
  registry: ghcr.io
  pullPolicy: Always

# GitHub-specific resource labels
labels:
  github.com/org: ${GITHUB_ORG}
  github.com/repo: ${GITHUB_REPO}
  github.com/workflow: ${GITHUB_WORKFLOW}

# GitHub Actions specific environment variables
env:
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-token
        key: token
  - name: GITHUB_REPOSITORY
    value: ${GITHUB_ORG}/${GITHUB_REPO}
  - name: GITHUB_SHA
    value: ${GITHUB_SHA}

# Override specific component settings if needed
loki-stack:
  loki:
    persistence:
      storageClassName: standard
  promtail:
    image:
      registry: ghcr.io

prometheus:
  server:
    persistence:
      storageClassName: standard
  alertmanager:
    persistence:
      storageClassName: standard
  pushgateway:
    persistence:
      storageClassName: standard

grafana:
  persistence:
    storageClassName: standard 